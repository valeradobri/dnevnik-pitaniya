name: dnevnik
description: "Персональный ассистент по питанию, калориям и здоровым привычкам"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management ───────────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── Navigation ─────────────────────────────────────────────────────
  go_router: ^14.6.3

  # ── Database ───────────────────────────────────────────────────────
  drift: ^2.23.1
  drift_flutter: ^0.2.5
  sqlite3_flutter_libs: ^0.5.28

  # ── Storage ────────────────────────────────────────────────────────
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  path: ^1.9.0

  # ── Charts ─────────────────────────────────────────────────────────
  fl_chart: ^0.70.2

  # ── UI & Typography ────────────────────────────────────────────────
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # ── Utilities ──────────────────────────────────────────────────────
  intl: ^0.20.2
  equatable: ^2.0.7
  collection: ^1.19.1
  http: ^1.6.0
  mobile_scanner: ^7.4.3
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  share_plus: ^12.0.2
  file_selector: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Code generation (только Drift — Riverpod ручной для Фазы 1) ───
  build_runner: ^2.4.14
  drift_dev: ^2.23.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
